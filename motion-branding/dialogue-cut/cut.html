<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:ND;font-weight:700;src:url(FONTS/noto-sans-devanagari-devanagari-700-normal.woff2);unicode-range:U+0900-097F}
@font-face{font-family:ND;font-weight:800;src:url(FONTS/noto-sans-devanagari-devanagari-800-normal.woff2);unicode-range:U+0900-097F}

html,body{width:1080px;height:1920px;overflow:hidden;background:transparent;font-family:PP,ND,sans-serif;color:#f4f6fa}
#hd{position:absolute;left:0;top:0;width:1080px;height:230px;background:#fff}

#hd .wt{position:absolute;right:372px;top:84px;text-align:right;font:700 22px/1.55 PP;letter-spacing:6px;color:#475569}
#hd .sep{position:absolute;right:346px;top:62px;width:2px;height:106px;background:#cbd5e1}
#hd .w{position:absolute;right:46px;top:66px;height:98px}
.bars{position:absolute;left:0;right:0;height:12px;display:flex}.bars i{flex:1}
.bars i:nth-child(1){background:#f26522}.bars i:nth-child(2){background:#f5a623}.bars i:nth-child(3){background:#1a8fe3}.bars i:nth-child(4){background:#2e9b44}
#ft{position:absolute;left:0;top:1730px;width:1080px;height:190px;background:#0a1f3d}
#ft .av{position:absolute;left:46px;top:42px;width:104px;height:104px;border-radius:50%;border:5px solid #f26522;background:url(founder.jpeg) center/cover}
#ft .nm{position:absolute;left:170px;top:48px;font:800 30px/1.3 PP,ND}
#ft .nm small{display:block;font:500 21px/1.4 PP,ND;color:#94a3b8}
#ft .vl{position:absolute;left:470px;top:34px;width:2px;height:120px;background:rgba(255,255,255,.18)}
#ft .ph{position:absolute;left:500px;top:28px;font:800 46px PP;color:#f5a623}
#ft .em{position:absolute;left:500px;top:98px;font:500 25px PP;color:#e2e8f0}
#ft .ad{position:absolute;left:500px;top:138px;font:500 22px PP,ND;color:#94a3b8}
#prog{position:absolute;left:0;bottom:0;height:6px;width:100%;background:rgba(255,255,255,.12)}#prog b{display:block;height:100%;width:0;background:#f5a623}
#card{position:absolute;left:40px;top:1296px;width:1000px;border-radius:30px;background:rgba(11,36,71,.9);padding:26px 36px 30px;display:none;box-shadow:0 14px 40px rgba(0,0,0,.4)}
#tag{display:inline-block;padding:6px 26px;border-radius:30px;font:800 32px/1.4 PP,ND;margin-bottom:12px}
#txt{font:700 44px/1.5 PP,ND;white-space:pre-wrap}
.cur{display:inline-block;width:0;position:relative}.cur:after{content:"";position:absolute;left:3px;bottom:-4px;width:4px;height:42px;background:#f5a623}
#static{display:none}
</style></head><body>
<div id="static"><div id="hd"><img class="k" src="klogo.png"><div class="wt">WAAREE<br>SOLAR PROVIDER</div><div class="sep"></div><img class="w" src="wlogo.png"></div>
<div class="bars" style="top:230px"><i></i><i></i><i></i><i></i></div>
<div id="ft"><div class="av"></div><div class="nm">इं. प्रिंस केशरी<small>संस्थापक, केशरी इको सोलर</small></div><div class="vl"></div>
 <div class="ph">78983 87061</div><div class="em">keshariecosolararchitect@gmail.com</div><div class="ad">📍 वाड्रफनगर, बलरामपुर, छत्तीसगढ़</div><div id="prog"><b></b></div></div></div>
<div id="card"><span id="tag"></span><div id="txt"></div></div>
<script>
const $=id=>document.getElementById(id),clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const GS=new Intl.Segmenter('hi',{granularity:'grapheme'}),gr=s=>[...GS.segment(s)].map(x=>x.segment);
const SPK={B:{name:'बुधराम',bg:'#f5a623',fg:'#0b2447'},G:{name:'गनपत',bg:'#bfe3ff',fg:'#0b2447'}};
let TL=null;
window.setTimeline=t=>{TL=t;TL.lines.forEach(l=>{l.g=gr(l.text);l.typeDur=Math.max(0.6,l.dur*0.86)})};
window.showStatic=on=>{$('static').style.display=on?'block':'none';document.body.style.background='transparent'};
window.render=t=>{
  const l=TL.lines.find(l=>t>=l.start-0.05&&t<l.start+l.dur+0.6);
  const c=$('card');
  if(!l){c.style.display='none';return}
  c.style.display='block';
  const inn=clamp((t-(l.start-0.05))/0.25),out=clamp((t-(l.start+l.dur+0.25))/0.35);
  c.style.opacity=inn*(1-out);c.style.transform=`translateY(${(1-inn)*40}px)`;
  const s=SPK[l.spk];$('tag').textContent=s.name;$('tag').style.background=s.bg;$('tag').style.color=s.fg;
  const n=Math.floor(clamp((t-l.start)/l.typeDur)*l.g.length+(t>=l.start?0.001:0));
  const typed=l.g.slice(0,n).join(''),rest=l.g.slice(n).join('');
  const esc=x=>x.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const showCur=n<l.g.length||(Math.floor(t*4)%2===0&&t<l.start+l.dur);
  $('txt').innerHTML=esc(typed)+(showCur?'<span class="cur"></span>':'')+`<span style="visibility:hidden">${esc(rest)}</span>`;
};
window.progress=f=>{$('prog').firstElementChild.style.width=(f*100)+'%'};
window.events=()=>{const ev=[];TL.lines.forEach(l=>l.g.forEach((ch,i)=>ev.push({t:l.start+i/l.g.length*l.typeDur,kind:ch===' '?'space':ch==='\n'?'return':'key'})));return ev.sort((a,b)=>a.t-b.t)};
</script></body></html>
